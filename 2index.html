html<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реалистичный Тверкающий Кот</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            transition: background 0.5s ease;
        }

        body.rage-mode {
            animation: disco 0.6s infinite alternate;
        }

        @keyframes disco {
            0% { background: #ff0055; }
            50% { background: #00ffaa; }
            100% { background: #9900ff; }
        }

        /* Неуловимая кнопка */
        #run-btn {
            position: absolute;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            z-index: 10;
            transition: transform 0.1s ease, left 0.15s ease-out, top 0.15s ease-out;
        }

        /* Контейнер реалистичного кота */
        .cat-container {
            position: absolute;
            width: 120px;
            height: 150px;
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            animation: fadeOutCat 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Слой 1: Пушистое тело и ушки (вид сзади) */
        .cat-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #e67e22 25%, #d35400 60%);
            border-radius: 50% 50% 40% 40%;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.3);
        }

        /* Ушки кота */
        .cat-body::before, .cat-body::after {
            content: '';
            position: absolute;
            top: -15px;
            width: 30px;
            height: 35px;
            background: #d35400;
            border-radius: 30% 70% 30% 30%;
        }
        .cat-body::before { left: 15px; transform: rotate(-15deg); }
        .cat-body::after { right: 15px; transform: rotate(15deg); }

        /* Слой 2: Тверкающая пушистая попа */
        .cat-butt {
            position: absolute;
            bottom: 5px;
            left: 15px;
            width: 90px;
            height: 75px;
            background: radial-gradient(circle at 50% 50%, #f39c12 30%, #e67e22 80%);
            border-radius: 50%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            transform-origin: top center;
            /* Бешеная и плавная амплитуда тверка */
            animation: realisticTwerk 0.18s infinite alternate ease-in-out;
        }

        /* Слой 3: Пушистый виляющий хвост */
        .cat-tail {
            position: absolute;
            top: 20px;
            left: 35px;
            width: 20px;
            height: 80px;
            background: linear-gradient(to bottom, #d35400, #f39c12, #ffffff);
            border-radius: 10px;
            transform-origin: bottom center;
            animation: tailWag 0.09s infinite alternate ease-in-out;
        }

        /* Физика тверка нижней части */
        @keyframes realisticTwerk {
            0% { 
                transform: translateY(0) scaleX(1.05) scaleY(0.9) skewX(-12deg); 
            }
            100% { 
                transform: translateY(-8px) scaleX(0.95) scaleY(1.05) skewX(12deg); 
            }
        }

        /* Бешеное виляние хвоста в такт */
        @keyframes tailWag {
            0% { transform: rotate(-35deg) translateY(-5px); }
            100% { transform: rotate(35deg) translateY(5px); }
        }

        /* Исчезновение кота с легким прыжком вверх */
        @keyframes fadeOutCat {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            15% { transform: translate(-50%, -50%) scale(1.1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -120px) scale(0.7); }
        }

        /* Искры */
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            z-index: 5;
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <button id="run-btn">Нажми меня!</button>

    <script>
        const btn = document.getElementById('run-btn');
        let evadeCount = 0; 
        
        const phrases = [
            "Мимо! 😜",
            "Почти... Но нет! 🚀",
            "Ай, щекотно! 😂",
            "Медленно думаешь! 🐢",
            "Ошибка 404: Кнопка ушла 💨",
            "Рыжий одобряет твой промах! 🐾"
        ];

        // Мультяшный звук (Web Audio API)
        function playSqueakSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(160, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(950, ctx.currentTime + 0.12);
            
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
        }

        // Спавн красивого многослойного кота
        function spawnRealisticCat(x, y) {
            const container = document.createElement('div');
            container.classList.add('cat-container');
            container.style.left = `${x}px`;
            container.style.top = `${y}px`;

            const body = document.createElement('div');
            body.classList.add('cat-body');

            const butt = document.createElement('div');
            butt.classList.add('cat-butt');

            const tail = document.createElement('div');
            tail.classList.add('cat-tail');

            // Собираем кота: хвост крепится к попе, попа к телу
            butt.appendChild(tail);
            body.appendChild(butt);
            container.appendChild(body);
            
            document.body.appendChild(container);
            setTimeout(() => container.remove(), 1200); 
        }

        // Эффект взрыва частиц
        function createParticles(x, y) {
            const colors = ['#ff416c', '#ff4b2b', '#00ffaa', '#ffbe0b', '#3a86ff'];
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 6 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 90 + 40;
                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        }

        // Логика побега
        btn.addEventListener('mouseover', () => {
            evadeCount++;
            
            const btnWidth = btn.offsetWidth;
            const btnHeight = btn.offsetHeight;
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            const rect = btn.getBoundingClientRect();
            const oldCenterX = rect.left + btnWidth / 2;
            const oldCenterY = rect.top + btnHeight / 2;

            // Запускаем кота, звук и искры
            spawnRealisticCat(oldCenterX, oldCenterY);
            createParticles(oldCenterX, oldCenterY);
            playSqueakSound();

            if (evadeCount === 10) {
                document.body.classList.add('rage-mode');
                btn.style.background = 'linear-gradient(45deg, #00ffaa, #00ff55)';
            }

            const newX = Math.random() * (windowWidth - btnWidth - 40) + 20;
            const newY = Math.random() * (windowHeight - btnHeight - 40) + 20;

            btn.style.left = `${newX}px`;
            btn.style.top = `${newY}px`;
            btn.innerText = phrases[Math.floor(Math.random() * phrases.length)];
        });

        // Победа
        btn.addEventListener('click', () => {
            document.body.classList.remove('rage-mode');
            alert(`🏆 Легенда! Ты поймал кнопку после ${evadeCount} попыток! Кот потрясен твоей реакцией.`);
            evadeCount = 0;
            btn.style.background = 'linear-gradient(45deg, #ff416c, #ff4b2b)';
        });
    </script>
</body>
</html>
